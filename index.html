<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSports Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7fa; --card-bg: #ffffff; --text-color: #333333;
            --sidebar-bg: #1a1c23; --sidebar-text: #a0aec0; --accent: #4318FF;
            --success: #01B574; --danger: #EE5D50;
        }
        [data-theme="dark"] {
            --bg-color: #0b1437; --card-bg: #111c44; --text-color: #ffffff;
            --sidebar-bg: #0b1437; --sidebar-text: #a0aec0;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); display: flex; transition: 0.3s;}
        
        .sidebar { width: 250px; height: 100vh; background: var(--sidebar-bg); padding: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .sidebar h2 { color: white; margin-bottom: 30px;}
        .nav-link { display: block; padding: 12px; color: var(--sidebar-text); text-decoration: none; margin-bottom: 10px; border-radius: 8px;}
        .nav-link:hover { background: var(--accent); color: white; }

        .main-content { flex: 1; padding: 30px; height: 100vh; overflow-y: auto;}
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;}
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;}
        .card { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);}
        .card h3 { margin: 0; font-size: 14px; color: var(--sidebar-text); }
        .card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; }
        .profit-positive { color: var(--success); }
        .profit-negative { color: var(--danger); }

        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px;}
        .chart-container { background: var(--card-bg); padding: 20px; border-radius: 15px; }

        .form-container { background: var(--card-bg); padding: 20px 30px; border-radius: 15px; margin-bottom: 30px;}
        .form-container h2 { margin-top: 0; font-size: 18px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; display: flex; flex-direction: column; min-width: 150px; }
        .form-group label { font-size: 12px; color: var(--sidebar-text); margin-bottom: 5px; text-transform: uppercase;}
        .form-group input, .form-group select { padding: 10px; border-radius: 8px; border: 1px solid rgba(160, 174, 192, 0.3); background: var(--bg-color); color: var(--text-color);}
        .submit-btn, .theme-btn { padding: 12px; font-weight: bold; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🎮 eSports UI</h2>
        <a href="#" class="nav-link">Dashboard</a>
        <a href="#" class="nav-link">Finance</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Analytics Overview</h1>
            <div>
                <select id="timeFilter" style="padding: 8px; border-radius: 8px; background: var(--card-bg); color: var(--text-color);">
                    <option value="7">Last 7 Days</option>
                    <option value="30" selected>Last 30 Days</option>
                    <option value="365">Last 1 Year</option>
                    <option value="9999">All Time</option>
                </select>
                <button class="theme-btn" onclick="toggleTheme()">Toggle Theme</button>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <h3>Total Income</h3>
                <p id="totalRevenue">$0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">$0.00</p>
            </div>
            <div class="card">
                <h3>Net Profit / Loss</h3>
                <p id="netProfit">$0.00</p>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-container">
                <canvas id="profitChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <div class="form-container">
            <h2>Record Transaction</h2>
            <form id="financeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="type" required>
                            <option value="INCOME">Gain (Income)</option>
                            <option value="EXPENSE">Loss (Expense)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" id="amount" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="transactionDate" required>
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" id="transactionTime" required>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button type="submit" class="submit-btn" style="width: 100%;">+ Add Record</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function setDateTimeDefaults() {
            document.getElementById('transactionDate').valueAsDate = new Date();
            document.getElementById('transactionTime').value = new Date().toTimeString().slice(0,5);
        }
        setDateTimeDefaults();

        const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
        
        let profitChartInst, expenseChartInst;

        function updateDashboard() {
            const days = document.getElementById('timeFilter').value;
            
            // 1. Update Number Cards
            fetch(`http://localhost:8080/api/dashboard/stats?days=${days}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('totalRevenue').innerText = formatter.format(data.totalRevenue);
                    document.getElementById('totalExpense').innerText = formatter.format(data.totalExpense);
                    const profitEl = document.getElementById('netProfit');
                    profitEl.innerText = formatter.format(data.netProfit);
                    profitEl.className = data.netProfit >= 0 ? 'profit-positive' : 'profit-negative';
                });

            // 2. Update Charts Dynamically
            fetch('http://localhost:8080/api/finance/all')
                .then(r => r.json())
                .then(transactions => {
                    let dates = [];
                    let profitData = [];
                    let runningProfit = 0;
                    
                    let incomeTotal = 0;
                    let expenseTotal = 0;

                    // Sort by date so line chart flows correctly
                    transactions.sort((a, b) => new Date(a.transactionDate) - new Date(b.transactionDate));

                    transactions.forEach(t => {
                        if(t.type === 'INCOME') {
                            runningProfit += t.amount;
                            incomeTotal += t.amount;
                        } else {
                            runningProfit -= t.amount;
                            expenseTotal += t.amount;
                        }
                        dates.push(t.transactionDate);
                        profitData.push(runningProfit);
                    });

                    // Render Line Chart
                    if(profitChartInst) profitChartInst.destroy();
                    profitChartInst = new Chart(document.getElementById('profitChart'), {
                        type: 'line',
                        data: {
                            labels: dates.length > 0 ? dates : ['No Data'],
                            datasets: [{
                                label: 'Net Profit ($)',
                                data: profitData.length > 0 ? profitData : [0],
                                borderColor: '#4318FF', tension: 0.3
                            }]
                        }
                    });

                    // Render Doughnut Chart
                    if(expenseChartInst) expenseChartInst.destroy();
                    expenseChartInst = new Chart(document.getElementById('expenseChart'), {
                        type: 'doughnut',
                        data: {
                            labels: ['Total Income', 'Total Expense'],
                            datasets: [{
                                data: [incomeTotal, expenseTotal],
                                backgroundColor: ['#01B574', '#EE5D50'], borderWidth: 0
                            }]
                        }
                    });
                });
        }

        document.getElementById('timeFilter').addEventListener('change', updateDashboard);
        updateDashboard();

        document.getElementById('financeForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const transactionData = {
                title: document.getElementById('title').value,
                type: document.getElementById('type').value,
                amount: parseFloat(document.getElementById('amount').value),
                transactionDate: document.getElementById('transactionDate').value,
                transactionTime: document.getElementById('transactionTime').value + ":00" 
            };

            fetch('http://localhost:8080/api/finance/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(transactionData)
            }).then(r => {
                if(r.ok) {
                    document.getElementById('financeForm').reset();
                    setDateTimeDefaults();
                    updateDashboard(); 
                }
            });
        });
    </script>
</body>
</html>

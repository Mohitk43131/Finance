<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSports Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7fa; --card-bg: #ffffff; --text-color: #333333;
            --sidebar-bg: #1a1c23; --sidebar-text: #a0aec0; --accent: #4318FF;
            --success: #01B574; --danger: #EE5D50;
        }
        [data-theme="dark"] {
            --bg-color: #0b1437; --card-bg: #111c44; --text-color: #ffffff;
            --sidebar-bg: #0b1437; --sidebar-text: #a0aec0;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); display: flex; transition: 0.3s; height: 100vh; overflow: hidden;}
        
        /* Login Overlay */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 20, 55, 0.95); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 15px;
            width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .google-btn { width: 100%; padding: 12px; background: white; color: #333; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .google-btn:hover { background: #f1f1f1; }
        .guest-btn { width: 100%; padding: 12px; background: transparent; color: var(--sidebar-text); border: 1px solid var(--sidebar-text); border-radius: 8px; cursor: pointer; }
        .guest-btn:hover { color: white; border-color: white; }

        /* Main App UI */
        .sidebar { width: 250px; height: 100vh; background: var(--sidebar-bg); padding: 20px; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column;}
        .sidebar h2 { color: white; margin-bottom: 30px;}
        .nav-link { display: block; padding: 12px; color: var(--sidebar-text); text-decoration: none; margin-bottom: 10px; border-radius: 8px;}
        .nav-link:hover { background: var(--accent); color: white; }

        .main-content { flex: 1; padding: 30px; height: 100vh; overflow-y: auto;}
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px;}
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;}
        .card { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);}
        .card h3 { margin: 0; font-size: 14px; color: var(--sidebar-text); }
        .card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; }
        .profit-positive { color: var(--success); }
        .profit-negative { color: var(--danger); }

        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px;}
        .chart-container { background: var(--card-bg); padding: 20px; border-radius: 15px; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        .form-container { background: var(--card-bg); padding: 20px 30px; border-radius: 15px; margin-bottom: 30px; display: none; }
        .form-container h2 { margin-top: 0; font-size: 18px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; display: flex; flex-direction: column; min-width: 150px; }
        .form-group label { font-size: 12px; color: var(--sidebar-text); margin-bottom: 5px; text-transform: uppercase;}
        .form-group input, .form-group select { padding: 10px; border-radius: 8px; border: 1px solid rgba(160, 174, 192, 0.3); background: var(--bg-color); color: var(--text-color);}
        .submit-btn, .theme-btn { padding: 12px; font-weight: bold; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; }
        
        #userInfo { font-size: 14px; color: var(--sidebar-text); margin-right: 15px; }
        .badge { background: var(--accent); color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-left: 5px;}
        select { padding: 8px; border-radius: 8px; background: var(--card-bg); color: var(--text-color); border: 1px solid rgba(160, 174, 192, 0.3); outline: none;}
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color: white; margin-top: 0;">eSports Analytics</h2>
            <p style="color: #a0aec0; font-size: 14px; margin-bottom: 20px;">Sign in to manage finances</p>
            
            <button id="googleSignInBtn" class="google-btn">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Sign in with Google
            </button>
            
            <button id="guestBtn" class="guest-btn">Continue as Guest Viewer</button>
        </div>
    </div>

    <div class="sidebar">
        <div>
            <h2>🎮 eSports UI</h2>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="finance.html" class="nav-link">Finance</a>
        </div>
        <button id="logoutBtn" style="margin-top: auto; padding: 10px; background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; cursor: pointer; display: none;">Sign Out</button>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1 style="margin-top: 0; margin-bottom: 5px;">Analytics Overview</h1>
                <p id="daysInfo" style="margin: 0; color: var(--sidebar-text); font-size: 14px;"></p>
            </div>
            <div style="display: flex; align-items: center;">
                <span id="userInfo"></span>
                <select id="timeFilter">
                    <option value="7">Last 7 Days</option>
                    <option value="30" selected>Last 30 Days</option>
                    <option value="365">Last 1 Year</option>
                    <option value="9999">All Time</option>
                </select>
                <button id="themeToggleBtn" class="theme-btn" style="margin-left: 10px;">Toggle Theme</button>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <h3>Total Income</h3>
                <p id="totalRevenue">$0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">$0.00</p>
            </div>
            <div class="card">
                <h3>Net Profit / Loss</h3>
                <p id="netProfit">$0.00</p>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-header">
                    <h3 style="margin: 0; color: var(--sidebar-text);">Profit Trend</h3>
                    <select id="chartType">
                        <option value="line">Line Graph</option>
                        <option value="bar">Bar Graph</option>
                    </select>
                </div>
                <canvas id="profitChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-header">
                    <h3 style="margin: 0; color: var(--sidebar-text);">Income vs Expense</h3>
                </div>
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <div class="form-container" id="adminForm">
            <h2>Record Transaction</h2>
            <form id="financeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="type" required>
                            <option value="INCOME">Gain (Income)</option>
                            <option value="EXPENSE">Loss (Expense)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" id="amount" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="transactionDate" required>
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" id="transactionTime" required>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button type="submit" class="submit-btn" style="width: 100%;">+ Add Record</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>

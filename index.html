<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ff eSports Dashboard</title>
        </div> <script type="module" src="app.js"></script>
</body>
</html>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7fa; --card-bg: #ffffff; --text-color: #333333;
            --sidebar-bg: #1a1c23; --sidebar-text: #a0aec0; --accent: #4318FF;
            --success: #01B574; --danger: #EE5D50;
        }
        [data-theme="dark"] {
            --bg-color: #0b1437; --card-bg: #111c44; --text-color: #ffffff;
            --sidebar-bg: #0b1437; --sidebar-text: #a0aec0;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); display: flex; transition: 0.3s; height: 100vh; overflow: hidden;}
        
        /* Login Overlay */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 20, 55, 0.95); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 15px;
            width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(160, 174, 192, 0.3); background: var(--bg-color); color: var(--text-color); outline: none;}
        .login-box input:focus { border-color: var(--accent); }
        .auth-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .auth-btn { flex: 1; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .auth-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .auth-btn-secondary { background: #4a5568; } /* Darker grey for Sign Up */
        .guest-btn { width: 100%; padding: 12px; background: transparent; color: var(--sidebar-text); border: 1px solid var(--sidebar-text); border-radius: 8px; cursor: pointer; transition: 0.2s;}
        .guest-btn:hover { color: var(--text-color); border-color: var(--text-color); }

        /* Main App UI */
        .sidebar { width: 250px; height: 100vh; background: var(--sidebar-bg); padding: 20px; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column;}
        .sidebar h2 { color: white; margin-bottom: 30px;}
        .nav-link { display: block; padding: 12px; color: var(--sidebar-text); text-decoration: none; margin-bottom: 10px; border-radius: 8px;}
        .nav-link:hover, .nav-link.active { background: var(--accent); color: white; }

        .main-content { flex: 1; padding: 30px; height: 100vh; overflow-y: auto;}
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px;}
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;}
        .card { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);}
        .card h3 { margin: 0; font-size: 14px; color: var(--sidebar-text); }
        .card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; }
        .profit-positive { color: var(--success); }
        .profit-negative { color: var(--danger); }

        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px;}
        .chart-container { background: var(--card-bg); padding: 20px; border-radius: 15px; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        .form-container { background: var(--card-bg); padding: 20px 30px; border-radius: 15px; margin-bottom: 30px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05);}
        .form-container h2 { margin-top: 0; font-size: 18px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; display: flex; flex-direction: column; min-width: 150px; }
        .form-group label { font-size: 12px; color: var(--sidebar-text); margin-bottom: 5px; text-transform: uppercase;}
        .form-group input, .form-group select { padding: 10px; border-radius: 8px; border: 1px solid rgba(160, 174, 192, 0.3); background: var(--bg-color); color: var(--text-color);}
        .submit-btn, .theme-btn { padding: 12px; font-weight: bold; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; }
        
        #userInfo { font-size: 14px; color: var(--sidebar-text); margin-right: 15px; }
        .badge { background: var(--accent); color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-left: 5px;}
        select { padding: 8px; border-radius: 8px; background: var(--card-bg); color: var(--text-color); border: 1px solid rgba(160, 174, 192, 0.3); outline: none;}
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color: var(--text-color); margin-top: 0;">eSports Analytics</h2>
            <p style="color: var(--sidebar-text); font-size: 14px; margin-bottom: 20px;">Sign in to manage finances</p>
            
            <input type="email" id="emailInput" placeholder="Email Address" required>
            <input type="password" id="passwordInput" placeholder="Password" required>
            
            <div class="auth-buttons">
                <button id="signInBtn" class="auth-btn">Sign In</button>
                <button id="signUpBtn" class="auth-btn auth-btn-secondary">Sign Up</button>
            </div>
            
            <button id="guestBtn" class="guest-btn">Continue as Guest Viewer</button>
        </div>
    </div>

    <div class="sidebar">
        <div>
            <h2>🎮 ff eSports</h2>
            <a href="index.html" class="nav-link active">Overview</a>
            <a href="dashboard.html" class="nav-link">Performance Stats</a>
            <a href="finance.html" class="nav-link">Finance Ledger</a>
        </div>
        <button id="logoutBtn" style="margin-top: auto; padding: 10px; background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; cursor: pointer; display: none;">Sign Out</button>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1 style="margin-top: 0; margin-bottom: 5px;">Analytics Overview</h1>
                <p id="daysInfo" style="margin: 0; color: var(--sidebar-text); font-size: 14px;"></p>
            </div>
            <div style="display: flex; align-items: center;">
                <span id="userInfo"></span>
                <select id="timeFilter">
                    <option value="7">Last 7 Days</option>
                    <option value="30" selected>Last 30 Days</option>
                    <option value="365">Last 1 Year</option>
                    <option value="9999">All Time</option>
                </select>
                <button id="themeToggleBtn" class="theme-btn" style="margin-left: 10px;">Toggle Theme</button>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <h3>Total Income</h3>
                <p id="totalRevenue">₹0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0.00</p>
            </div>
            <div class="card">
                <h3>Net Profit / Loss</h3>
                <p id="netProfit">₹0.00</p>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-header">
                    <h3 style="margin: 0; color: var(--sidebar-text);">Profit Trend</h3>
                    <select id="chartType">
                        <option value="line">Line Graph</option>
                        <option value="bar">Bar Graph</option>
                    </select>
                </div>
                <canvas id="profitChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-header">
                    <h3 style="margin: 0; color: var(--sidebar-text);">Income vs Expense</h3>
                </div>
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <div class="form-container" id="adminForm">
            <h2>Record Transaction</h2>
            <form id="financeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="type" required>
                            <option value="INCOME">Gain (Income)</option>
                            <option value="EXPENSE">Loss (Expense)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" id="amount" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="transactionDate" required>
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" id="transactionTime" required>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button type="submit" class="submit-btn" style="width: 100%;">+ Add Record</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // IMPORT EMAIL & PASSWORD AUTH METHODS
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA45woJ-QeDGpk7KkS_jkSaXuBTnqkzcQ8",
            authDomain: "next-streaming-645b2.firebaseapp.com",
            databaseURL: "https://next-streaming-645b2-default-rtdb.firebaseio.com",
            projectId: "next-streaming-645b2",
            storageBucket: "next-streaming-645b2.firebasestorage.app",
            messagingSenderId: "353530200083",
            appId: "1:353530200083:web:f82a1534b65ac4bbe5ffe6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 🔴 ADD YOUR ADMIN EMAILS HERE 🔴
        const ADMIN_EMAILS = ["your.email@gmail.com", "mohit.main@gmail.com"]; 

        let allTransactions = [];
        let profitChartInst, expenseChartInst;
        const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

        // --- 2. EMAIL & PASSWORD AUTHENTICATION LOGIC ---

        // Sign Up
        document.getElementById('signUpBtn').addEventListener('click', () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            if(!email || !password) return alert("Please enter both email and password.");

            createUserWithEmailAndPassword(auth, email, password)
                .catch(error => alert("Sign Up Error: " + error.message));
        });

        // Sign In
        document.getElementById('signInBtn').addEventListener('click', () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            if(!email || !password) return alert("Please enter both email and password.");

            signInWithEmailAndPassword(auth, email, password)
                .catch(error => alert("Login Error: " + error.message));
        });

        // Continue as Guest
        document.getElementById('guestBtn').addEventListener('click', () => {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('userInfo').innerHTML = `Guest <span class="badge" style="background: #718096;">VISITOR</span>`;
        });

        // Sign Out
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('adminForm').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('userInfo').innerHTML = '';
                document.getElementById('emailInput').value = '';
                document.getElementById('passwordInput').value = '';
            });
        });

        // Listen for Login State Changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';

                // Check if user's email is in the admin list
                const isAdmin = ADMIN_EMAILS.includes(user.email);
                
                // Get the text before the @ symbol to use as a display name
                const displayName = user.email.split('@')[0];
                
                if (isAdmin) {
                    document.getElementById('adminForm').style.display = 'block'; 
                    document.getElementById('userInfo').innerHTML = `${displayName} <span class="badge">ADMIN</span>`;
                } else {
                    document.getElementById('adminForm').style.display = 'none'; 
                    document.getElementById('userInfo').innerHTML = `${displayName} <span class="badge" style="background: #718096;">VISITOR</span>`;
                }
            }
        });


        // --- 3. UI CONTROLS & DATE HELPERS ---
        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        function setDateTimeDefaults() {
            document.getElementById('transactionDate').valueAsDate = new Date();
            document.getElementById('transactionTime').value = new Date().toTimeString().slice(0,5);
        }
        setDateTimeDefaults();


        // --- 4. REAL-TIME DATABASE FETCHING ---
        const financesRef = ref(db, 'finances');
        onValue(financesRef, (snapshot) => {
            const data = snapshot.val();
            allTransactions = []; 
            
            if (data) {
                allTransactions = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                allTransactions.sort((a, b) => new Date(a.transactionDate) - new Date(b.transactionDate));
            }
            
            updateDashboardUI(); 
        });


        // --- 5. DASHBOARD RENDERING ---
        function updateDashboardUI() {
            const days = parseInt(document.getElementById('timeFilter').value);
            const selectedChartType = document.getElementById('chartType').value;
            
            const infoEl = document.getElementById('daysInfo');
            const today = new Date();
            const pastDate = new Date();
            pastDate.setDate(today.getDate() - days);
            
            if(days === 9999) infoEl.innerText = "Showing All Time Data";
            else infoEl.innerText = `Showing data from ${pastDate.toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'})} to ${today.toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'})}`;

            const filteredTransactions = allTransactions.filter(t => {
                if (days === 9999) return true;
                const tDate = new Date(t.transactionDate);
                return tDate >= pastDate;
            });

            let runningProfit = 0;
            let incomeTotal = 0;
            let expenseTotal = 0;
            let dates = [];
            let profitData = [];

            filteredTransactions.forEach(t => {
                const amt = parseFloat(t.amount);
                if(t.type === 'INCOME') { runningProfit += amt; incomeTotal += amt; } 
                else { runningProfit -= amt; expenseTotal += amt; }
                
                dates.push(t.transactionDate);
                profitData.push(runningProfit);
            });

            document.getElementById('totalRevenue').innerText = formatter.format(incomeTotal);
            document.getElementById('totalExpense').innerText = formatter.format(expenseTotal);
            const netProfit = incomeTotal - expenseTotal;
            const profitEl = document.getElementById('netProfit');
            profitEl.innerText = formatter.format(netProfit);
            profitEl.className = netProfit >= 0 ? 'profit-positive' : 'profit-negative';

            if(profitChartInst) profitChartInst.destroy();
            profitChartInst = new Chart(document.getElementById('profitChart'), {
                type: selectedChartType,
                data: {
                    labels: dates.length > 0 ? dates : ['No Data'],
                    datasets: [{ label: 'Net Profit ($)', data: profitData.length > 0 ? profitData : [0], backgroundColor: '#4318FF', borderColor: '#4318FF', tension: 0.3 }]
                }
            });

            if(expenseChartInst) expenseChartInst.destroy();
            expenseChartInst = new Chart(document.getElementById('expenseChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Total Income', 'Total Expense'],
                    datasets: [{ data: [incomeTotal, expenseTotal], backgroundColor: ['#01B574', '#EE5D50'], borderWidth: 0 }]
                }
            });
        }

        document.getElementById('timeFilter').addEventListener('change', updateDashboardUI);
        document.getElementById('chartType').addEventListener('change', updateDashboardUI);


        // --- 6. FORM SUBMISSION (WRITE TO FIREBASE) ---
        document.getElementById('financeForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const newTransactionRef = push(ref(db, 'finances'));
            
            const transactionData = {
                title: document.getElementById('title').value,
                type: document.getElementById('type').value,
                amount: parseFloat(document.getElementById('amount').value),
                transactionDate: document.getElementById('transactionDate').value,
                transactionTime: document.getElementById('transactionTime').value
            };

            set(newTransactionRef, transactionData)
                .then(() => {
                    document.getElementById('financeForm').reset();
                    setDateTimeDefaults();
                })
                .catch((error) => {
                    alert(
